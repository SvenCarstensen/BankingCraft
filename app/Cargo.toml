[package]
name = "bankingcraft"
description = "BankingCraft – Online-Banking für Windows, Linux und macOS (FinTS/HBCI, chipTAN USB, HBCI-Chipkarte)"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true

[features]
default = []
# Opt-in only; reads a machine-local file at runtime, never embeds its contents.
local-fints-test = []

[dependencies]
sys-locale = "0.3"
i18n = { package = "bankingcraft-i18n", path = "../crates/i18n" }
fints = { path = "../crates/fints" }
cardreader = { path = "../crates/cardreader" }
egui = "=0.36.0"
eframe = { version = "=0.36.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
svgtypes = "0.16"
fontdb = "0.23"
winit = "0.30"
chrono.workspace = true
serde.workspace = true
rust_decimal.workspace = true
log.workspace = true
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
env_logger = "0.11"
zeroize = "1"
arboard = { version = "3.7", default-features = false }
sha2 = "0.10"
rfd = "0.18"

[package.metadata.bundle]
name = "BankingCraft"
identifier = "de.appcreation.bankingcraft"

[dev-dependencies]
egui_kittest = { version = "=0.36.0", features = ["wgpu", "snapshot", "eframe"] }
i18n = { package = "bankingcraft-i18n", path = "../crates/i18n", features = ["test-support"] }
