[package]
name = "bankingcraft"
description = "BankingCraft – Online-Banking für Windows, Linux und macOS (FinTS/HBCI, chipTAN USB, HBCI-Chipkarte)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
sys-locale = "0.3"
i18n = { package = "bankingcraft-i18n", path = "../crates/i18n" }
fints = { path = "../crates/fints" }
cardreader = { path = "../crates/cardreader" }
slint = { version = "~1.18", features = ["unstable-winit-030"] }
chrono.workspace = true
serde.workspace = true
rust_decimal.workspace = true
log.workspace = true
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
env_logger = "0.11"
zeroize = "1"
arboard = { version = "3.7", default-features = false }
sha2 = "0.10"

[build-dependencies]
serde_json = "1"
slint-build = "1.18"

[package.metadata.bundle]
name = "BankingCraft"
identifier = "de.appcreation.bankingcraft"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
i18n = { package = "bankingcraft-i18n", path = "../crates/i18n", features = ["test-support"] }
