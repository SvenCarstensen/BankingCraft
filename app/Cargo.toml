[package]
name = "bankingcraft"
description = "BankingCraft – Online-Banking für Windows, Linux und macOS (FinTS/HBCI, chipTAN USB, HBCI-Chipkarte)"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true

[features]
default = []
# Explicit local installation only; the external ID is never compiled into the app.
local-fints-test = ["aqbanking/local-fints-test"]

[dependencies]
sys-locale = "0.3"
i18n = { package = "bankingcraft-i18n", path = "../crates/i18n" }
banking = { package = "bankingcraft-models", path = "../crates/banking-models" }
aqbanking = { package = "bankingcraft-aqbanking", path = "../crates/aqbanking" }
egui = "=0.36.0"
eframe = { version = "=0.36.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
svgtypes = "0.16"
# System font discovery uses Fontations; egui renders the selected fonts with skrifa.
fontique = "0.13"
# Keep Wayland decorations, but avoid ab_glyph -> owned_ttf_parser -> ttf-parser.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont"] }
chrono.workspace = true
serde.workspace = true
rust_decimal.workspace = true
log.workspace = true
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
zeroize = "1"
arboard = { version = "3.7", default-features = false }
sha2 = "0.10"
rfd = "0.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
cc = "1"

[package.metadata.bundle]
name = "BankingCraft"
identifier = "de.appcreation.bankingcraft"

[dev-dependencies]
roxmltree = "0.20"
egui_kittest = { version = "=0.36.0", features = ["wgpu", "snapshot", "eframe"] }
i18n = { package = "bankingcraft-i18n", path = "../crates/i18n", features = ["test-support"] }
