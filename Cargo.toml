[workspace]
resolver = "2"
members = ["crates/fints", "crates/cardreader", "app", "crates/i18n", "crates/i18n-macros", "crates/crossfont-compat"]

# winit 0.30 / sctk-adwaita 0.10 require crossfont 0.8, whose fontconfig-sys 5
# conflicts with Fontique's version 6. Crossfont 0.9 preserves the rendering API;
# this re-export uses its updated system binding without vendoring a renderer.
[patch.crates-io]
crossfont = { path = "crates/crossfont-compat" }

[workspace.package]
version = "0.0.9"
edition = "2021"
license = "GPL-3.0-only"
authors = ["AppCreation GmbH"]

[workspace.dependencies]
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
rust_decimal = { version = "1", features = ["serde-with-str"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
